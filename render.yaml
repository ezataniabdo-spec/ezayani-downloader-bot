# One-click Render deploy (polling mode, free background worker)
services:
  - type: worker
    name: ezayani-downloader-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false          # set it in the dashboard (from @BotFather)
      - key: AD_LINK
        sync: false          # your shrinkme/monetag link
      - key: ENABLE_AD_STEP
        value: "1"
      - key: AD_WAIT_SECONDS
        value: "15"
      - key: ENABLE_FORCE_SUB
        value: "1"
      - key: FORCE_SUB_CHANNEL
        value: "@EzayaniChannel"
      - key: CHANNEL_LINK
        value: "https://t.me/EzayaniChannel"
